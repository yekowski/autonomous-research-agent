[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-research-agent"
version = "0.1.0"
description = "Production-grade Autonomous Research Agent with adversarial critique and Qdrant evidence store"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-agents-cli",
    "docling",
    "qdrant-client",
    "yfinance",
    "pytest",
    "python-dotenv",
    "streamlit",
    "edgartools",
    "googlesearch-python",
    "openai",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
